    // DOM 요소 참조
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const resultCountText = document.getElementById('resultCountText');
    const articlesGrid = document.getElementById('articlesGrid');
    const emptyState = document.getElementById('emptyState');
    const emptyResetBtn = document.getElementById('emptyResetBtn');
    const toast = document.getElementById('toast');
    const quickChips = document.querySelectorAll('.quick-chip');

    let toastTimer = null;

    /**
     * XSS 방지를 위한 HTML 특수문자 이스케이프 함수
     * @param {string} str - 원본 문자열
     * @returns {string} 이스케이프된 안전한 문자열
     */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /**
     * 정규식 특수문자 이스케이프 함수
     * @param {string} str - 검색어 문자열
     * @returns {string} 정규식에 안전하게 사용할 수 있는 문자열
     */
    function escapeRegExp(str) {
      return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /**
     * 본문 텍스트에서 검색 키워드를 안전하게 <mark>로 하이라이트 처리
     * @param {string} bodyText - 조항 본문
     * @param {string} keyword - 앞뒤 공백이 제거된 검색어
     * @returns {string} 하이라이트가 적용된 안전한 HTML 문자열
     */
    function highlightBodyText(bodyText, keyword) {
      const safeBody = escapeHtml(bodyText);
      if (!keyword) {
        return safeBody;
      }
      const safeKeyword = escapeHtml(keyword);
      const regex = new RegExp(`(${escapeRegExp(safeKeyword)})`, 'gi');
      return safeBody.replace(
        regex,
        '<mark class="bg-yellow-200 text-slate-900 px-0.5 rounded-sm font-medium">$1</mark>'
      );
    }

    /**
     * 토스트 알림 표시
     * @param {string} message - 표시할 안내 문구
     */
    function showToast(message) {
      toast.textContent = message;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      if (toastTimer) {
        clearTimeout(toastTimer);
      }
      toastTimer = setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2000);
    }

    /**
     * 조항 텍스트를 클립보드에 복사 (iframe 호환 execCommand 방식 사용)
     * @param {Object} article - 복사할 조항 객체
     */
    function copyArticle(article) {
      const textToCopy = `${article.조}(${article.제목})\n${article.본문}`;
      try {
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast(`${article.조} (${article.제목}) 내용이 복사되었습니다.`);
      } catch (err) {
        showToast('복사에 실패했습니다. 직접 선택하여 복사해 주세요.');
      }
    }

    /**
     * 필터링된 조항 목록을 카드 형태로 렌더링
     * @param {string} rawQuery - 사용자 입력 검색어
     */
    function renderArticles(rawQuery = '') {
      const keyword = rawQuery.trim();
      const lowerKeyword = keyword.toLowerCase();

      // 검색어 초기화 버튼 표시 여부 토글
      if (rawQuery.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      // 본문(item.본문) 기준 필터링
      const filtered = keyword
        ? LAW_ARTICLES.filter((item) => item.본문.toLowerCase().includes(lowerKeyword))
        : LAW_ARTICLES;

      // 결과 건수 실시간 업데이트
      resultCountText.textContent = `결과 ${filtered.length}건`;

      // 기존 카드 비우기
      articlesGrid.innerHTML = '';

      // 0건일 때 빈 상태 안내 표시
      if (filtered.length === 0) {
        articlesGrid.classList.add('hidden');
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      articlesGrid.classList.remove('hidden');

      // 문서 프래그먼트를 이용한 효율적인 카드 생성
      const fragment = document.createDocumentFragment();

      filtered.forEach((article) => {
        const card = document.createElement('article');
        card.className =
          'bg-white border border-slate-200 rounded-2xl p-5 sm:p-6 shadow-sm hover:shadow-md hover:border-gov-200 transition flex flex-col justify-between';

        // 카드 상단: 조 번호 뱃지 + 제목 + 복사 버튼
        const header = document.createElement('div');
        header.className = 'flex items-start justify-between gap-3 pb-3.5 mb-3.5 border-b border-slate-100';

        const titleWrap = document.createElement('div');
        titleWrap.className = 'flex items-center flex-wrap gap-2.5 min-w-0';

        const badge = document.createElement('span');
        badge.className =
          'inline-flex items-center px-2.5 py-1 rounded-lg bg-gov-700 text-white text-xs font-semibold tracking-wide shrink-0';
        badge.textContent = article.조;

        const title = document.createElement('h2');
        title.className = 'text-base sm:text-[17px] font-bold text-slate-900 leading-snug';
        title.textContent = article.제목;

        titleWrap.appendChild(badge);
        titleWrap.appendChild(title);

        const copyBtn = document.createElement('button');
        copyBtn.type = 'button';
        copyBtn.title = `${article.조} 내용 복사`;
        copyBtn.setAttribute('aria-label', `${article.조} ${article.제목} 복사`);
        copyBtn.className =
          'p-2 -mr-1.5 -mt-1 rounded-lg text-slate-400 hover:text-gov-700 hover:bg-gov-50 transition shrink-0';
        copyBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        `;
        copyBtn.addEventListener('click', () => copyArticle(article));

        header.appendChild(titleWrap);
        header.appendChild(copyBtn);

        // 카드 본문: 줄바꿈 유지를 위해 whitespace-pre-line 적용
        const body = document.createElement('p');
        body.className = 'text-sm sm:text-[15px] text-slate-700 leading-relaxed whitespace-pre-line break-keep';
        body.innerHTML = highlightBodyText(article.본문, keyword);

        card.appendChild(header);
        card.appendChild(body);
        fragment.appendChild(card);
      });

      articlesGrid.appendChild(fragment);
    }

    /**
     * 검색어 초기화 핸들러
     */
    function resetSearch() {
      searchInput.value = '';
      renderArticles('');
      searchInput.focus();
    }

    // 이벤트 리스너 등록
    searchInput.addEventListener('input', (event) => {
      renderArticles(event.target.value);
    });

    clearBtn.addEventListener('click', resetSearch);
    emptyResetBtn.addEventListener('click', resetSearch);

    // 추천 검색어 칩 클릭 시 해당 키워드로 즉시 검색
    quickChips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const kw = chip.getAttribute('data-keyword') || '';
        searchInput.value = kw;
        renderArticles(kw);
        searchInput.focus();
      });
    });

    // 초기 렌더링 (15개 전체 조항 표시)
    renderArticles('');
  </script>
</body>
</html>
